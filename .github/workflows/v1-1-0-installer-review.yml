name: Community Release Same Installer Review

"on":
  workflow_dispatch:
    inputs:
      installer_run_id:
        description: Build run containing immutable MSI and NSIS
        required: true
      current_version:
        description: Current package version
        required: true
        default: "1.1.22"
      previous_version:
        description: Previous official version
        required: true
        default: "1.1.21"
      candidate_commit:
        description: Exact source commit from the original installer build receipt
        required: true

permissions:
  contents: read
  actions: read

jobs:
  review:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      LONGEDIT_INSTALLED_VERSION_SCENARIO: "1"
      LONGEDIT_R5I_DISPOSABLE: "1"
      RELEASE_VERSION: ${{ inputs.current_version }}
      PREVIOUS_VERSION: ${{ inputs.previous_version }}
      CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
      INSTALLER_RUN_ID: ${{ inputs.installer_run_id }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Validate immutable review inputs
        shell: powershell
        run: |
          if ($env:CANDIDATE_COMMIT -notmatch '^[0-9a-f]{40}$' -or $env:INSTALLER_RUN_ID -notmatch '^[1-9][0-9]+$' -or $env:RELEASE_VERSION -notmatch '^1\.\d+\.\d+$' -or $env:PREVIOUS_VERSION -notmatch '^1\.\d+\.\d+$') { throw 'Invalid immutable review inputs' }
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Check real unauthenticated official update API before installer work
        run: node scripts/check-installed-review-network.mjs
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.installer_run_id }}
          name: community-release-candidate-lifecycle-${{ inputs.installer_run_id }}
          path: immutable-build
      - name: Verify same installers and successful original build gates
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $run = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:INSTALLER_RUN_ID" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $run.head_sha -ne $env:CANDIDATE_COMMIT) { throw 'Original build source identity drifted' }
          $jobs = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:INSTALLER_RUN_ID/jobs" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Original build job receipt unavailable' }
          foreach ($name in @('Run frozen candidate release quality gate', 'Run complete Rust regression suite', 'Build frozen candidate MSI and NSIS', 'Capture immutable installer receipt')) {
            $step = @($jobs.jobs.steps | Where-Object { $_.name -eq $name })
            if ($step.Count -ne 1 -or $step[0].conclusion -ne 'success') { throw "Original gate did not pass: $name" }
          }
          $root = Join-Path $env:GITHUB_WORKSPACE 'immutable-build'
          $receipt = Get-Content -Encoding UTF8 -LiteralPath (Join-Path $root 'community-release-output\installer-build-receipt.json') -Raw | ConvertFrom-Json
          $previous = Get-Content -Encoding UTF8 -LiteralPath "docs/evidence/v$($env:PREVIOUS_VERSION)-release/release-receipt.json" -Raw | ConvertFrom-Json
          if ($receipt.candidateSourceCommit -ne $env:CANDIDATE_COMMIT -or $receipt.appVersion -ne $env:RELEASE_VERSION -or $receipt.previousVersion -ne $env:PREVIOUS_VERSION -or $receipt.previousSourceCommit -ne $previous.release.taggedCommit -or $receipt.previousInstallerSource -ne 'official-github-release' -or $receipt.sourceUserContentIncluded -ne $false -or $receipt.artifacts.Count -ne 2) { throw 'Installer receipt identity or boundary drifted' }
          foreach ($artifact in $receipt.artifacts) {
            if ($artifact.target -notin @('msi','nsis') -or $artifact.authenticodeStatus -ne 'NotSigned') { throw 'Unexpected installer target or signing status' }
            $folder = Join-Path $root "current-product\src-tauri\target\release\bundle\$($artifact.target)"
            $file = Get-Item -LiteralPath (Join-Path $folder $artifact.fileName)
            if ($file.Length -ne $artifact.sizeBytes -or (Get-FileHash -Algorithm SHA256 -LiteralPath $file.FullName).Hash.ToLowerInvariant() -ne $artifact.sha256) { throw 'Current installer size/hash drifted' }
          }
          $old = Get-Item -LiteralPath (Join-Path $root "previous-official\LongEdit_$($env:PREVIOUS_VERSION)_x64-setup.exe")
          $oldAsset = @($previous.assets | Where-Object { $_.name -eq $old.Name })
          if ($oldAsset.Count -ne 1 -or $old.Length -ne $oldAsset[0].sizeBytes -or (Get-FileHash -Algorithm SHA256 -LiteralPath $old.FullName).Hash.ToLowerInvariant() -ne $oldAsset[0].sha256 -or $receipt.previousInstallerSha256 -ne $oldAsset[0].sha256) { throw 'Previous official installer drifted' }
          "CURRENT_INSTALLER_DIRECTORY=$(Join-Path $root 'current-product\src-tauri\target\release\bundle\nsis')" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "PREVIOUS_INSTALLER_DIRECTORY=$($old.Directory.FullName)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "CURRENT_INSTALLER_SHA256=$(@($receipt.artifacts | Where-Object { $_.target -eq 'nsis' })[0].sha256)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Set up independent XLSX producer Python
        if: contains(fromJSON('["1.1.16","1.1.17", "1.1.18", "1.1.19", "1.1.20", "1.1.21", "1.1.22"]'), inputs.current_version)
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install hash-pinned independent XLSX producer
        if: contains(fromJSON('["1.1.16","1.1.17", "1.1.18", "1.1.19", "1.1.20", "1.1.21", "1.1.22"]'), inputs.current_version)
        shell: powershell
        run: scripts/setup-hosted-xlsx-producer.ps1
      - name: Test directory identity without changing the filesystem
        run: node --test scripts/test-release-directory-identity.mjs
      - name: Retain original build reports separately from installer bytes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: community-release-original-build-reports-${{ github.run_id }}
          path: immutable-build/community-release-output
          if-no-files-found: error
          retention-days: 14
      - name: Test canonical search fixture parents with owned temporary directories
        run: node --test scripts/test-installed-search-fixture-path.mjs
      - name: Run complete same-installer lifecycle and installed workflow
        shell: powershell
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/run-r5i-isolated-install-lifecycle.ps1 `
            -InstallerDirectory $env:CURRENT_INSTALLER_DIRECTORY `
            -PreviousInstallerDirectory $env:PREVIOUS_INSTALLER_DIRECTORY `
            -CurrentVersion $env:RELEASE_VERSION -PreviousVersion $env:PREVIOUS_VERSION `
            -ExpectedCurrentSha256 $env:CURRENT_INSTALLER_SHA256 `
            -NodeExecutable (Get-Command node.exe).Source `
            -InstalledSmokeScript (Join-Path $env:GITHUB_WORKSPACE 'scripts/capture-r5j-installed-artifact-smoke.mjs') `
            -ManagementRollbackSmokeScript (Join-Path $env:GITHUB_WORKSPACE 'scripts/capture-r5l-management-rollback-smoke.mjs') `
            -EvidenceExporter (Join-Path $env:GITHUB_WORKSPACE 'scripts/export-r5k-windows-evidence-bundle.ps1') `
            -ExpectedSourceCommit $env:CANDIDATE_COMMIT `
            -OutputDirectory (Join-Path $env:GITHUB_WORKSPACE 'same-installer-review') `
            -ConfirmDisposableMachine -AllowInstallerMutation
          if ($LASTEXITCODE -ne 0) { throw 'Same-installer lifecycle failed' }
      - name: Retain runner network observation
        if: always()
        shell: powershell
        run: |
          if (Test-Path -LiteralPath installer-network-preflight.json) {
            New-Item -ItemType Directory -Path same-installer-review -Force | Out-Null
            Copy-Item -LiteralPath installer-network-preflight.json -Destination same-installer-review/installer-network-preflight.json
          }
      - name: Retain original build receipt with review reports
        if: always()
        shell: powershell
        run: |
          $source = Join-Path $env:GITHUB_WORKSPACE 'immutable-build\community-release-output\installer-build-receipt.json'
          $destination = Join-Path $env:GITHUB_WORKSPACE 'same-installer-review'
          if (Test-Path -LiteralPath $source) {
            New-Item -ItemType Directory -Path $destination -Force | Out-Null
            Copy-Item -LiteralPath $source -Destination (Join-Path $destination 'installer-build-receipt.json')
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: community-release-installer-review-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: error
          path: same-installer-review
