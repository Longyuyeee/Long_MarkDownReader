name: v1.0.25 Installed Acceptance Review
"on":
  push:
    branches: [codex/v125-experience-roadmap]
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Build run containing the frozen v1.0.25 installers
        required: true
permissions:
  contents: read
  actions: read
jobs:
  installed-review:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      LONGEDIT_R5I_DISPOSABLE: "1"
      LONGEDIT_INSTALLED_VERSION_SCENARIO: "1"
      GH_TOKEN: ${{ github.token }}
      BUILD_RUN_ID: ${{ inputs.build_run_id || '38039833628' }}
      PRODUCT_SOURCE_COMMIT: 2f44e143b32b2ac4fb317e24ff6beb9652b95429
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Download and verify frozen installer bytes
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:BUILD_RUN_ID -notmatch '^\d+$') { throw 'Invalid build run id' }
          gh run download $env:BUILD_RUN_ID --name "v125-candidate-lifecycle-$env:BUILD_RUN_ID" --dir candidate
          if ($LASTEXITCODE -ne 0) { throw 'Candidate download failed' }
          $receipts = @(Get-ChildItem candidate -Recurse -Filter installer-build-receipt.json)
          if ($receipts.Count -ne 1) { throw 'Ambiguous build receipt' }
          $receipt = Get-Content -LiteralPath $receipts[0].FullName -Raw | ConvertFrom-Json
          if ($receipt.appVersion -ne '1.0.25' -or $receipt.candidateSourceCommit -ne $env:PRODUCT_SOURCE_COMMIT -or $receipt.artifacts.Count -ne 2) { throw 'Frozen source/version mismatch' }
          foreach ($asset in $receipt.artifacts) {
            $files = @(Get-ChildItem candidate -Recurse -File | Where-Object Name -eq $asset.fileName)
            if ($files.Count -ne 1 -or $files[0].Length -ne $asset.sizeBytes -or (Get-FileHash -LiteralPath $files[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant() -ne $asset.sha256) { throw 'Current installer byte mismatch' }
          }
          $previousReceipt = Get-Content docs/evidence/v1.0.24-release/release-receipt.json -Raw | ConvertFrom-Json
          $previousAsset = @($previousReceipt.assets | Where-Object name -eq 'LongEdit_1.0.24_x64-setup.exe')[0]
          $previous = @(Get-ChildItem candidate -Recurse -Filter $previousAsset.name)
          if ($previous.Count -ne 1 -or $previous[0].Length -ne $previousAsset.sizeBytes -or (Get-FileHash -LiteralPath $previous[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant() -ne $previousAsset.sha256) { throw 'Previous official installer byte mismatch' }
      - name: Check installed lifecycle with corrected version support
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $receiptFile = @(Get-ChildItem candidate -Recurse -Filter installer-build-receipt.json)[0]
          $receipt = Get-Content -LiteralPath $receiptFile.FullName -Raw | ConvertFrom-Json
          $current = @(Get-ChildItem candidate -Recurse -Filter '*_1.0.25_x64-setup.exe')[0]
          $previous = @(Get-ChildItem candidate -Recurse -Filter 'LongEdit_1.0.24_x64-setup.exe')[0]
          $nsis = @($receipt.artifacts | Where-Object target -eq 'nsis')[0]
          & ./scripts/run-r5i-isolated-install-lifecycle.ps1 `
            -InstallerDirectory $current.DirectoryName `
            -PreviousInstallerDirectory $previous.DirectoryName `
            -CurrentVersion '1.0.25' -PreviousVersion '1.0.24' `
            -ExpectedCurrentSha256 $nsis.sha256 `
            -ExpectedSourceCommit $env:PRODUCT_SOURCE_COMMIT `
            -NodeExecutable (Get-Command node.exe).Source `
            -InstalledSmokeScript "$pwd/scripts/capture-r5j-installed-artifact-smoke.mjs" `
            -ManagementRollbackSmokeScript "$pwd/scripts/capture-r5l-management-rollback-smoke.mjs" `
            -EvidenceExporter "$pwd/scripts/export-r5k-windows-evidence-bundle.ps1" `
            -OutputDirectory "$pwd/installed-review-output" `
            -ConfirmDisposableMachine -AllowInstallerMutation
      - name: Preserve observations including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v125-installed-review-${{ github.run_id }}
          path: installed-review-output
          if-no-files-found: error
          retention-days: 30
