name: Community Release Installer Lifecycle

"on":
  workflow_dispatch:
    inputs:
      candidate_commit:
        description: Exact 40-character frozen product commit
        required: true
      current_version:
        description: Current package version
        required: true
        default: "1.3.2"
      previous_version:
        description: Previous official public version
        required: true
        default: "1.3.1"
      build_only:
        description: Build fixed installers; complete installation runs in the mandatory same-installer review
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  candidate-lifecycle:
    name: Build MSI/NSIS and exercise official upgrade
    runs-on: windows-latest
    timeout-minutes: 75
    env:
      CARGO_TERM_COLOR: always
      LONGEDIT_INSTALLED_VERSION_SCENARIO: "1"
      LONGEDIT_R5I_DISPOSABLE: "1"
      PREVIOUS_VERSION: ${{ inputs.previous_version }}
      RELEASE_VERSION: ${{ inputs.current_version }}
      CANDIDATE_COMMIT: ${{ inputs.candidate_commit || github.sha }}

    steps:
      - name: Check out orchestration contracts
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          path: orchestration

      - name: Reject mutable candidate references
        shell: powershell
        run: |
          if ($env:CANDIDATE_COMMIT -notmatch '^[0-9a-f]{40}$' -or $env:RELEASE_VERSION -notmatch '^1\.\d+\.\d+$' -or $env:PREVIOUS_VERSION -notmatch '^1\.\d+\.\d+$') { throw 'Invalid frozen candidate commit or release versions' }
          "CANDIDATE_COMMIT=$env:CANDIDATE_COMMIT" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Check out frozen candidate
        uses: actions/checkout@v6
        with:
          ref: ${{ env.CANDIDATE_COMMIT }}
          fetch-depth: 0
          path: current-product

      - name: Check out previous public release
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Join-Path $env:GITHUB_WORKSPACE 'orchestration'
          $previous = Join-Path $env:GITHUB_WORKSPACE 'previous-product'
          # The full orchestration clone already contains the immutable tag.
          # This baseline checkout is used only for identity/package metadata;
          # the previous installer is downloaded and hashed separately below.
          $expected = (& git -C $source rev-list -n 1 "v$env:PREVIOUS_VERSION").Trim()
          if ($LASTEXITCODE -ne 0 -or $expected -notmatch '^[0-9a-f]{40}$') { throw 'Previous public tag is unavailable' }
          & git clone --shared --no-checkout $source $previous
          if ($LASTEXITCODE -ne 0) { throw 'Local previous-source clone failed' }
          & git -C $previous sparse-checkout set --no-cone /package.json /package-lock.json
          if ($LASTEXITCODE -ne 0) { throw 'Previous metadata checkout could not be prepared' }
          & git -C $previous checkout --detach $expected
          if ($LASTEXITCODE -ne 0) { throw 'Previous public tag could not be checked out' }

      - name: Resolve and verify source identities
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $candidate = (& git -C (Join-Path $env:GITHUB_WORKSPACE 'current-product') rev-parse HEAD).Trim().ToLowerInvariant()
          $previous = (& git -C (Join-Path $env:GITHUB_WORKSPACE 'previous-product') rev-parse HEAD).Trim().ToLowerInvariant()
          $expectedPrevious = (& git -C (Join-Path $env:GITHUB_WORKSPACE 'orchestration') rev-list -n 1 "v$env:PREVIOUS_VERSION").Trim().ToLowerInvariant()
          $package = Get-Content -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'current-product\package.json') -Raw | ConvertFrom-Json
          $previousPackage = Get-Content -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'previous-product\package.json') -Raw | ConvertFrom-Json
          if ($candidate -ne $env:CANDIDATE_COMMIT -or $previous -ne $expectedPrevious) { throw 'Resolved source identity does not match the immutable inputs.' }
          if ($package.version -ne $env:RELEASE_VERSION -or $previousPackage.version -ne $env:PREVIOUS_VERSION) { throw 'Candidate or previous package version drifted.' }
          "PRODUCT_SOURCE_COMMIT=$candidate" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PREVIOUS_SOURCE_COMMIT=$previous" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CURRENT_APP_VERSION=$($package.version)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            current-product/package-lock.json
            previous-product/package-lock.json

      - name: Cache Rust build dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: current-product/src-tauri -> target
          # Retire the old partial cache; only a completed build seeds this key.
          prefix-key: v1-foundations-compiled-rust
          cache-on-failure: false

      - name: Install frozen candidate dependencies
        working-directory: current-product
        run: npm ci

      - name: Run frozen candidate release quality gate
        working-directory: current-product
        run: npm run ci:patch-release

      - name: Run complete Rust regression suite
        working-directory: current-product
        run: npm run test:rust

      - name: Build frozen candidate MSI and NSIS
        working-directory: current-product
        run: npm run tauri -- build --bundles msi,nsis --config ../orchestration/src-tauri/tauri.u2.conf.json

      - name: Download and verify previous official NSIS
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $receipt = Get-Content -LiteralPath (Join-Path $env:GITHUB_WORKSPACE "orchestration\docs\evidence\v$($env:PREVIOUS_VERSION)-release\release-receipt.json") -Raw | ConvertFrom-Json
          $asset = @($receipt.assets | Where-Object { $_.name -eq "LongEdit_$($env:PREVIOUS_VERSION)_x64-setup.exe" })
          if ($receipt.release.tag -ne "v$env:PREVIOUS_VERSION" -or $receipt.release.taggedCommit -ne $env:PREVIOUS_SOURCE_COMMIT -or $asset.Count -ne 1) { throw 'Previous release identity drift.' }
          $destination = Join-Path $env:GITHUB_WORKSPACE 'previous-official'
          New-Item -ItemType Directory -Path $destination -Force | Out-Null
          gh release download "v$env:PREVIOUS_VERSION" --repo Longyuyeee/Long_MarkDownReader --pattern $asset[0].name --dir $destination
          if ($LASTEXITCODE -ne 0) { throw 'Official installer download failed.' }
          $installer = Get-Item -LiteralPath (Join-Path $destination $asset[0].name)
          if ($installer.Length -ne $asset[0].sizeBytes -or (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant() -ne $asset[0].sha256) { throw 'Previous official installer digest/size mismatch.' }

      - name: Capture immutable installer receipt
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $msi = @(Get-ChildItem -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'current-product\src-tauri\target\release\bundle\msi') -File -Filter "*_$($env:CURRENT_APP_VERSION)_x64_zh-CN.msi")
          $nsis = @(Get-ChildItem -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'current-product\src-tauri\target\release\bundle\nsis') -File -Filter "*_$($env:CURRENT_APP_VERSION)_x64-setup.exe")
          $previousNsis = @(Get-ChildItem -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'previous-official') -File -Filter "*_$($env:PREVIOUS_VERSION)_x64-setup.exe")
          if ($msi.Count -ne 1 -or $nsis.Count -ne 1 -or $previousNsis.Count -ne 1) { throw 'Expected exactly one current MSI, current NSIS and previous NSIS.' }
          foreach ($artifact in @($msi[0], $nsis[0], $previousNsis[0])) {
            if ((Get-AuthenticodeSignature -LiteralPath $artifact.FullName).Status -ne 'NotSigned') { throw "Unexpected signature status: $($artifact.Name)" }
          }
          $output = Join-Path $env:GITHUB_WORKSPACE 'community-release-output'
          New-Item -ItemType Directory -Path $output -Force | Out-Null
          $receipt = [ordered]@{
            schemaVersion = 1
            stage = "V$env:RELEASE_VERSION"
            status = 'hosted-installers-built'
            candidateSourceCommit = $env:PRODUCT_SOURCE_COMMIT
            previousSourceCommit = $env:PREVIOUS_SOURCE_COMMIT
            appVersion = $env:CURRENT_APP_VERSION
            previousVersion = $env:PREVIOUS_VERSION
            previousInstallerSource = 'official-github-release'
            previousInstallerSha256 = (Get-FileHash -LiteralPath $previousNsis[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            runner = 'windows-latest'
            releaseCandidate = $false
            sourceUserContentIncluded = $false
            artifacts = @(
              [ordered]@{ target = 'msi'; fileName = $msi[0].Name; sizeBytes = $msi[0].Length; sha256 = (Get-FileHash -LiteralPath $msi[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant(); authenticodeStatus = 'NotSigned' },
              [ordered]@{ target = 'nsis'; fileName = $nsis[0].Name; sizeBytes = $nsis[0].Length; sha256 = (Get-FileHash -LiteralPath $nsis[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant(); authenticodeStatus = 'NotSigned' }
            )
          }
          [IO.File]::WriteAllText((Join-Path $output 'installer-build-receipt.json'), ($receipt | ConvertTo-Json -Depth 8), [Text.UTF8Encoding]::new($false))
          "CURRENT_INSTALLER_DIRECTORY=$($nsis[0].Directory.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PREVIOUS_INSTALLER_DIRECTORY=$($previousNsis[0].Directory.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CURRENT_INSTALLER_SHA256=$($receipt.artifacts[1].sha256)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "M8_21_OUTPUT=$output" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set up independent XLSX producer Python
        if: ${{ !inputs.build_only && contains(fromJSON('["1.1.16","1.1.17", "1.1.18", "1.1.19", "1.1.20", "1.1.21", "1.1.22", "1.1.23", "1.1.24", "1.1.25", "1.1.26", "1.1.27", "1.1.28", "1.1.29", "1.1.30", "1.1.31", "1.1.32", "1.1.33", "1.1.34", "1.1.35", "1.1.36", "1.1.37", "1.2.0", "1.2.1", "1.2.2", "1.2.3", "1.2.4", "1.2.5", "1.2.6", "1.2.7", "1.2.8", "1.2.9", "1.2.10", "1.2.11", "1.2.12", "1.2.13", "1.2.14", "1.2.15", "1.2.16", "1.2.17", "1.2.18", "1.2.19", "1.2.20", "1.2.21", "1.2.22", "1.2.23", "1.2.24", "1.2.25", "1.2.26", "1.2.27", "1.2.28", "1.2.29", "1.2.30", "1.2.31", "1.2.32", "1.2.33", "1.2.34", "1.2.35", "1.2.36", "1.2.37", "1.2.38", "1.2.39", "1.2.40", "1.2.41", "1.2.42", "1.2.43", "1.2.44", "1.2.45", "1.3.0", "1.3.1", "1.3.2"]'), inputs.current_version) }}
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install hash-pinned independent XLSX producer
        if: ${{ !inputs.build_only && contains(fromJSON('["1.1.16","1.1.17", "1.1.18", "1.1.19", "1.1.20", "1.1.21", "1.1.22", "1.1.23", "1.1.24", "1.1.25", "1.1.26", "1.1.27", "1.1.28", "1.1.29", "1.1.30", "1.1.31", "1.1.32", "1.1.33", "1.1.34", "1.1.35", "1.1.36", "1.1.37", "1.2.0", "1.2.1", "1.2.2", "1.2.3", "1.2.4", "1.2.5", "1.2.6", "1.2.7", "1.2.8", "1.2.9", "1.2.10", "1.2.11", "1.2.12", "1.2.13", "1.2.14", "1.2.15", "1.2.16", "1.2.17", "1.2.18", "1.2.19", "1.2.20", "1.2.21", "1.2.22", "1.2.23", "1.2.24", "1.2.25", "1.2.26", "1.2.27", "1.2.28", "1.2.29", "1.2.30", "1.2.31", "1.2.32", "1.2.33", "1.2.34", "1.2.35", "1.2.36", "1.2.37", "1.2.38", "1.2.39", "1.2.40", "1.2.41", "1.2.42", "1.2.43", "1.2.44", "1.2.45", "1.3.0", "1.3.1", "1.3.2"]'), inputs.current_version) }}
        shell: powershell
        run: orchestration/scripts/setup-hosted-xlsx-producer.ps1

      - name: Execute disposable install and installed-workspace lifecycle
        if: ${{ !inputs.build_only }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:GITHUB_WORKSPACE 'orchestration'
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $root 'scripts\run-r5i-isolated-install-lifecycle.ps1') `
            -InstallerDirectory $env:CURRENT_INSTALLER_DIRECTORY `
            -PreviousInstallerDirectory $env:PREVIOUS_INSTALLER_DIRECTORY `
            -CurrentVersion $env:CURRENT_APP_VERSION `
            -PreviousVersion $env:PREVIOUS_VERSION `
            -ExpectedCurrentSha256 $env:CURRENT_INSTALLER_SHA256 `
            -NodeExecutable (Get-Command node.exe).Source `
            -InstalledSmokeScript (Join-Path $root 'scripts\capture-r5j-installed-artifact-smoke.mjs') `
            -ManagementRollbackSmokeScript (Join-Path $root 'scripts\capture-r5l-management-rollback-smoke.mjs') `
            -EvidenceExporter (Join-Path $root 'scripts\export-r5k-windows-evidence-bundle.ps1') `
            -ExpectedSourceCommit $env:PRODUCT_SOURCE_COMMIT `
            -OutputDirectory $env:M8_21_OUTPUT `
            -ConfirmDisposableMachine `
            -AllowInstallerMutation

      - name: Upload community release lifecycle evidence and unsigned installers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: community-release-candidate-lifecycle-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 14
          path: |
            community-release-output
            current-product/src-tauri/target/release/bundle/msi/*_${{ inputs.current_version }}_x64_zh-CN.msi
            current-product/src-tauri/target/release/bundle/nsis/*_${{ inputs.current_version }}_x64-setup.exe
            previous-official/*_${{ inputs.previous_version }}_x64-setup.exe
