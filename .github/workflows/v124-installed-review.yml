name: v1.0.24 Installed Acceptance Review
"on":
  push:
    branches: [codex/v124-release-readiness]
    paths: [.github/workflows/v124-installed-review.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  installed-review:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      LONGEDIT_R5I_DISPOSABLE: "1"
      LONGEDIT_INSTALLED_VERSION_SCENARIO: "1"
      LONGEDIT_INSTALLED_V124_STABILITY: "1"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Download and verify frozen candidate bytes
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          gh run download 36535501168 --name v124-candidate-lifecycle-36535501168 --dir candidate
          if ($LASTEXITCODE -ne 0) { throw 'Candidate download failed' }
          node scripts/verify-v124-installer-receipt.mjs candidate
          if ($LASTEXITCODE -ne 0) { throw 'Candidate byte verification failed' }
      - name: Recheck installed lifecycle and corrected observation harness
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $receiptFiles = @(Get-ChildItem candidate -Recurse -Filter installer-build-receipt.json)
          if ($receiptFiles.Count -ne 1) { throw 'Ambiguous build receipt' }
          $receipt = Get-Content $receiptFiles[0].FullName -Raw | ConvertFrom-Json
          $current = @(Get-ChildItem candidate -Recurse -Filter '*_1.0.24_x64-setup.exe')
          $previous = @(Get-ChildItem candidate -Recurse -Filter 'LongEdit_1.0.23_x64-setup.exe')
          if ($current.Count -ne 1 -or $previous.Count -ne 1) { throw 'Ambiguous installers' }
          $nsis = @($receipt.artifacts | Where-Object target -eq 'nsis')[0]
          & ./scripts/run-r5i-isolated-install-lifecycle.ps1 `
            -InstallerDirectory $current[0].DirectoryName `
            -PreviousInstallerDirectory $previous[0].DirectoryName `
            -CurrentVersion '1.0.24' -PreviousVersion '1.0.23' `
            -ExpectedCurrentSha256 $nsis.sha256 `
            -ExpectedSourceCommit 'e3f4a268ca2c85b5ced87c078488dffb52c1690b' `
            -NodeExecutable (Get-Command node.exe).Source `
            -InstalledSmokeScript "$pwd/scripts/capture-r5j-installed-artifact-smoke.mjs" `
            -ManagementRollbackSmokeScript "$pwd/scripts/capture-r5l-management-rollback-smoke.mjs" `
            -EvidenceExporter "$pwd/scripts/export-r5k-windows-evidence-bundle.ps1" `
            -OutputDirectory "$pwd/installed-review-output" `
            -ConfirmDisposableMachine -AllowInstallerMutation
      - name: Preserve observations including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v124-installed-review-${{ github.run_id }}
          path: installed-review-output
          if-no-files-found: error
          retention-days: 30
