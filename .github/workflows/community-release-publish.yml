            $searchReview = Get-Content verified-review/installed-v118-workflow.json -Raw | ConvertFrom-Json
            if ($searchReview.harnessSourceCommit -ne $review.head_sha) { throw 'Installed search report does not belong to the successful review driver' }
            @'
          import fs from 'node:fs';
          import { validateInstalledSearchCompleteness } from './scripts/lib/installed-v1-1-8-evidence.mjs';
