  root.querySelectorAll(&#x27;button[aria-label]&#x27;).forEach(button =&gt; {
    if (!button.textContent.trim()) { const label = document.createElement(&#x27;span&#x27;); label.textContent = button.getAttribute(&#x27;aria-label&#x27;).replace(&#x27;当前标签&#x27;,&#x27;&#x27;).replace(&#x27;参考栏&#x27;,&#x27;&#x27;); button.append(label); }
  });
  const announce = text =&gt; { feedback.textContent = text; };
  const render = () =&gt; {
    root.classList.toggle(&#x27;le-nav-hidden&#x27;, !state.navigation);
    root.classList.toggle(&#x27;le-zen&#x27;, state.zen);
    root.querySelector(&#x27;#le-reference&#x27;).hidden = !state.reference;
    root.querySelector(&#x27;[data-action=&quot;navigation&quot;]&#x27;).setAttribute(&#x27;aria-expanded&#x27;, String(state.navigation));
