[package]
name = "tauri-plugin-mobile-storage"
version = "0.1.0"
authors = [ "longyuye" ]
description = "Android document tree and recoverable text draft access"
edition = "2021"
rust-version = "1.77.2"
exclude = ["/examples", "/dist-js", "/guest-js", "/node_modules"]
links = "tauri-plugin-mobile-storage"

[dependencies]
serde = "1.0"
serde_json = "1"
base64 = "0.22"
sha2 = "=0.10.9"
tempfile = "=3.26.0"

[target.'cfg(target_os = "android")'.dependencies]
tauri = { version = "2.10.0" }

[build-dependencies]
tauri-plugin = { version = "2.5.3", features = ["build"] }
