[package]
name = "tauri-app"
default-run = "tauri-app"
version = "1.0.7"
description = "A Tauri App"
authors = ["longyuye"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonc-parser = "=0.33.0"
window-vibrancy = "0.5"
encoding_rs = "0.8"
chardetng = "0.1"
anyhow = "1.0"
md5 = "0.7"
sha2 = "=0.10.9"
reqwest = { version = "0.12", default-features = true, features = ["json"] }
scraper = "0.22"
regex = "1.10"
base64 = "0.22"
flate2 = "=1.1.9"
urlencoding = "2.1"
pdf-extract = "=0.12.0"
lopdf = { version = "=0.42.0", default-features = false }
csv = "=1.4.0"
rust_xlsxwriter = "=0.96.0"
calamine = "=0.36.0"
chrono = "=0.4.44"
cfb = "=0.14.0"
quick-xml = "=0.41.0"
zip = { version = "=7.2.0", default-features = false, features = ["deflate"] }
a1 = "=1.0.2"
ironcalc = "=0.8.0"
tauri-plugin-dialog = "2.6.0"
tauri-plugin-fs = "2.4.5"
tauri-plugin-os = "2.3.2"
tauri-plugin-autostart = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
keyring = { version = "=3.6.3", features = ["apple-native", "windows-native", "sync-secret-service"] }
saphyr = "=0.0.11"
saphyr-parser = "=0.0.11"
toml_edit = "=0.25.13"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[profile.dev.package.miniz_oxide]
opt-level = 3

[profile.dev.package.quick-xml]
opt-level = 3
